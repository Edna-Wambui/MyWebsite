<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nairobi School</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- Navigation Section -->
     <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Courses</a>
        <a href="">Contact</a>
    </nav>
    <!-- Hero Section -->
     <section class="hero-contact">
        <h1>Contact Us</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quisquam, voluptatum!</p>
     </section>
     <section class="main-section">
        <div class="info">
            <img src="https://media.istockphoto.com/id/1500076821/photo/happy-black-teenage-girl-in-high-school-hallway-looking-at-camera.webp?a=1&b=1&s=612x612&w=0&k=20&c=rtdDbeGRSXMLx0VnNteRyDH7ImfL3muG45kkjznz6Pc=">
            <h2>Get in Touch</h2>
            <p>Email: info@mmm.com</p>
            <p>Phone: 0712345678</p>
            <p>Location: Nairobi, Kenya</p>
        </div>
        <div class="form">
            <form action="">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
     </section>
</body>
</html>
